codecov:
  require_ci_to_pass: yes
  #max_report_age: 72

coverage:
  round: down
  range: "70...100"
  precision: 2

  status:
    default_rules:
      target: auto
      threshold: 10%
    project:
      default:
        # basic
        #target: auto
        #threshold: 20%
        #flags:
        #  - unit
        #paths:
        #  - encoding
        # advanced
        #branches:
        #  - master
        if_ci_failed: error
        only_pulls: true
    patch:
      default:
        # basic
        target: 67
        #threshold: 20%
        # advanced
        #branches:
        #  - master
        #flags:
        #  - unit
        #paths:
        #  - encoding
        if_ci_failed: error
        only_pulls: false
    changes:
      default:
        # basic
        #target: auto
        #threshold: 20%
        # advanced
        #branches:
        #  - master
        #flags:
        #  - unit
        #paths:
        #  - encoding
        if_ci_failed: error
        only_pulls: false

parsers:
  gcov:
    branch_detection:
      conditional: yes
      loop: yes
      method: no
      macro: no

comment:
  layout: "reach,diff,flags,files,footer"
  behavior: default
  require_changes: no
