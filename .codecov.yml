codecov:
  require_ci_to_pass: yes
  max_report_age: 72

coverage:
  round: down
  range: "70...100"
  precision: 2

  status:
    project:
      default:
        # basic
        target: auto
        threshold: 2%
        flags:
          - unit
        paths:
          - encoding
        # advanced
        branches:
          - master
        if_not_found: success
        if_ci_failed: error
        informational: false
        only_pulls: true
    patch:
      default:
        # basic
        target: auto
        threshold: 5%
        base: auto
        # advanced
        branches:
          - master
        if_no_upload: error
        if_not_found: success
        if_ci_failed: error
        only_pulls: false
        flags:
          - unit
        paths:
          - encoding

parsers:
  gcov:
    branch_detection:
      conditional: yes
      loop: yes
      method: no
      macro: no

comment:
  layout: "reach,diff,flags,files,footer"
  behavior: default
  require_changes: no
