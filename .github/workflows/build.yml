name: Lint + Test + Build

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

jobs:

  golangci:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - name: Check out code into the Go module directory
        uses: actions/checkout@v2

      - name: golangci-lint
        uses: golangci/golangci-lint-action@v2
        with:
          version: v1.38
          args: --enable asciicheck --enable bodyclose --enable deadcode --enable depguard --enable dogsled --enable dupl --enable errcheck --enable exhaustive --enable exportloopref --enable funlen --enable gochecknoglobals --enable gochecknoinits --enable gocognit --enable goconst --enable gocritic --enable gocyclo --enable godot --enable goerr113 --enable gofmt --enable goimports --enable golint --enable gomnd --enable gomodguard --enable goprintffuncname --enable gosec --enable gosimple --enable govet --enable ineffassign --enable lll --enable misspell --enable nakedret --enable nestif --enable nlreturn --enable nolintlint --enable prealloc --enable rowserrcheck --enable scopelint --enable staticcheck --enable structcheck --enable stylecheck --enable typecheck --enable unconvert --enable unparam --enable unused --enable varcheck --enable whitespace


  test:
    name: Test
    runs-on: ubuntu-latest
    steps:

      - name: Set up Go 1.x
        uses: actions/setup-go@v2
        with:
          go-version: ^1.14
        id: go

      - name: Install gopacket/pcap dependencies
        run: sudo apt-get install -y libpcap-dev

      - name: Install go-app tool for reporting accurate Code Coverage
        run: go get github.com/ory/go-acc

      - name: Check out code into the Go module directory
        uses: actions/checkout@v2
        with:
          # because of "Issue detecting commit SHA. Please run actions/checkout with fetch-depth > 1 or set to 0"
          fetch-depth: 0

      - name: Test
        run: make test

      - name: Codecov
        uses: codecov/codecov-action@v1.2.1

  build:
    name: Build
    runs-on: ubuntu-latest
    steps:

      - name: Set up Go 1.x
        uses: actions/setup-go@v2
        with:
          go-version: 1.13
        id: go

      - name: Check out code into the Go module directory
        uses: actions/checkout@v2

      - name: Build
        run: make build
