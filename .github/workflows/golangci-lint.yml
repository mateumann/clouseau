name: Linting

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

jobs:

  golangci:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - name: Install gopacket/pcap dependencies
        run: sudo apt-get install -y libpcap-dev

      - name: Check out code into the Go module directory
        uses: actions/checkout@v2

      - name: golangci-lint
        uses: golangci/golangci-lint-action@v2
        with:
          # Required: the version of golangci-lint is required and must be specified without patch version: we always use the latest patch version.
          version: v1.31

          # Optional: working directory, useful for monorepos
          # working-directory: somedir

          # Optional: golangci-lint command line arguments.
          # args: --issues-exit-code=0
          args: --enable asciicheck --enable bodyclose --enable deadcode --enable depguard --enable dogsled --enable dupl --enable errcheck --enable exhaustive --enable exportloopref --enable funlen --enable gochecknoglobals --enable gochecknoinits --enable gocognit --enable goconst --enable gocritic --enable gocyclo --enable godot --enable goerr113 --enable gofmt --enable goimports --enable golint --enable gomnd --enable gomodguard --enable goprintffuncname --enable gosec --enable gosimple --enable govet --enable ineffassign --enable interfacer --enable lll --enable maligned --enable misspell --enable nakedret --enable nestif --enable nlreturn --enable nolintlint --enable prealloc --enable rowserrcheck --enable scopelint --enable staticcheck --enable structcheck --enable stylecheck --enable typecheck --enable unconvert --enable unparam --enable unused --enable varcheck --enable whitespace
          #     --enable wsl

          # Optional: show only new issues if it's a pull request. The default value is `false`.
          # only-new-issues: true
